name: CLI Release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Select notarization-capable Xcode
        run: |
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -r | head -n 1 || true)"
          if [ -z "$selected_xcode" ]; then
            echo "::error::Xcode 26 or newer is required for CLI notarization."
            exit 1
          fi
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve CLI release version
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CLI releases must use cli-vX.Y.Z tags."
            exit 1
          fi
          source_version="$(sed -n 's/.*ConnectorVersion = "\([^"]*\)".*/\1/p' apps/cli/internal/protocol/protocol.go)"
          if [ "$version" != "$source_version" ]; then
            echo "::error::CLI tag version $version does not match source version $source_version."
            exit 1
          fi
          echo "YTM_CLI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run CLI tests
        run: |
          pnpm exec vitest run tests/apps/cli-scaffold.test.ts
          pnpm run cli:test

      - name: Build CLI payloads
        run: |
          for runtime in macos-x64 macos-arm64 linux-x64 linux-arm64; do
            pnpm run cli:package -- --runtime="$runtime" --stage=payload
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf "%s" "$DEVELOPER_ID_APPLICATION_P12_BASE64" |
            base64 --decode > "$RUNNER_TEMP/developer-id-application.p12"
          security import "$RUNNER_TEMP/developer-id-application.p12" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s \
            "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"
          app_identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$app_identity" ]; then
            echo "::error::Developer ID Application identity was not imported."
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$app_identity" >> "$GITHUB_ENV"

      - name: Sign macOS CLI payloads
        run: |
          for runtime in macos-x64 macos-arm64; do
            payload="apps/cli/.build/package-work/$runtime/YTM-Enhancer-CLI-${YTM_CLI_VERSION}-$runtime"
            for executable in ytme ytme-native-host; do
              codesign --force --options runtime --timestamp \
                --sign "$DEVELOPER_ID_APPLICATION" \
                "$payload/$executable"
              codesign --verify --deep --strict --verbose=2 \
                "$payload/$executable"
            done
          done

      - name: Archive CLI packages
        run: |
          for runtime in macos-x64 macos-arm64 linux-x64 linux-arm64; do
            pnpm run cli:package -- --runtime="$runtime" --stage=archive
          done

      - name: Write notarization key
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" |
            base64 --decode > "$key_path"
          {
            echo "APP_STORE_CONNECT_PRIVATE_KEY=$key_path"
            echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize macOS CLI archives
        run: |
          for runtime in macos-x64 macos-arm64; do
            pnpm run cli:notarize -- \
              --archive="apps/cli/.build/packages/YTM-Enhancer-CLI-${YTM_CLI_VERSION}-$runtime.zip"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: YTM Enhancer CLI ${{ env.YTM_CLI_VERSION }}
          body_path: apps/cli/release/notes/${{ env.YTM_CLI_VERSION }}.md
          make_latest: false
          files: |
            apps/cli/.build/packages/*.zip
            apps/cli/.build/packages/*.tar.gz
            apps/cli/.build/packages/SHA256SUMS
