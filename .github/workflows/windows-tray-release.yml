name: Windows Tray Release

on:
  push:
    tags:
      - "windows-tray-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: windows-signing

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Windows tray release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^windows-tray-v", ""
          if ($version -notmatch "^[0-9]+\.[0-9]+\.[0-9]+$") {
            Write-Error "Windows tray releases must use windows-tray-vX.Y.Z tags."
            exit 1
          }

          $parts = $version.Split(".")
          $buildNumber = ([int] $parts[0] * 1000000) +
            ([int] $parts[1] * 1000) +
            [int] $parts[2]
          $metadataPath = "apps/windows-tray/release/metadata.json"
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            Write-Error "Windows tray release metadata is missing: $metadataPath"
            exit 1
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw |
            ConvertFrom-Json
          $metadataVersion = [string] $metadata.version
          $metadataBuildNumber = [string] $metadata.buildNumber
          if ($metadataVersion -ne $version) {
            Write-Error "Tag version $version does not match $metadataPath version $metadataVersion."
            exit 1
          }
          if ($metadataBuildNumber -ne [string] $buildNumber) {
            Write-Error "Build number $buildNumber does not match $metadataPath build number $metadataBuildNumber."
            exit 1
          }
          $notesPath = "apps/windows-tray/release/notes/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            Write-Error "Windows tray release notes are missing: $notesPath"
            exit 1
          }
          if ((Get-Item -LiteralPath $notesPath).Length -eq 0) {
            Write-Error "Windows tray release notes are empty: $notesPath"
            exit 1
          }
          "YTM_WINDOWS_TRAY_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "YTM_WINDOWS_TRAY_BUILD_NUMBER=$buildNumber" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows tray tests
        shell: pwsh
        run: |
          pnpm exec vitest run tests/apps/windows-tray-scaffold.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build release payloads
        shell: pwsh
        run: |
          pnpm run windows-tray:payload:win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:payload:win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign release payloads
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\windows-tray\.build\package-work
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed payloads
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-x64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-arm64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive release packages and generate update manifest
        shell: pwsh
        run: |
          pnpm run windows-tray:archive:win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:archive:win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:YTM_WINDOWS_TRAY_VERSION
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass `
            -File scripts/windows-qa/assert-explorer-archive-compatible.ps1 `
            -ArchivePath "apps/windows-tray/.build/packages/YTM-Tray-$version-win-x64.zip" `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-x64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass `
            -File scripts/windows-qa/assert-explorer-archive-compatible.ps1 `
            -ArchivePath "apps/windows-tray/.build/packages/YTM-Tray-$version-win-arm64.zip" `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-arm64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:update-manifest -- `
            "--package=apps/windows-tray/.build/packages/YTM-Tray-$version-win-x64.zip" `
            "--package=apps/windows-tray/.build/packages/YTM-Tray-$version-win-arm64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build combined installer
        shell: pwsh
        run: |
          pnpm run windows-tray:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign combined installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\windows-tray\.build\installer
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed combined installer
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: YTM Tray ${{ env.YTM_WINDOWS_TRAY_VERSION }}
          body_path: apps/windows-tray/release/notes/${{ env.YTM_WINDOWS_TRAY_VERSION }}.md
          make_latest: false
          files: |
            apps/windows-tray/.build/installer/*.exe
            apps/windows-tray/.build/packages/*.zip
            apps/windows-tray/.build/update-manifest/*.json
