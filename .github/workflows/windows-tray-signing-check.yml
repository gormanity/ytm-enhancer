name: Windows Tray Signing Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  signing-check:
    runs-on: windows-latest
    environment: windows-signing

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows tray tests
        shell: pwsh
        run: |
          pnpm exec vitest run tests/apps/windows-tray-scaffold.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build release payloads
        shell: pwsh
        run: |
          pnpm run windows-tray:payload:win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:payload:win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign release payloads
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\windows-tray\.build\package-work
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed payloads
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-x64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-arm64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive signed release packages and generate update manifest
        shell: pwsh
        run: |
          pnpm run windows-tray:archive:win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:archive:win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (
            Get-Content -LiteralPath apps/windows-tray/release/metadata.json -Raw |
              ConvertFrom-Json
          ).version
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass `
            -File scripts/windows-qa/assert-explorer-archive-compatible.ps1 `
            -ArchivePath "apps/windows-tray/.build/packages/YTM-Tray-$version-win-x64.zip" `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-x64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass `
            -File scripts/windows-qa/assert-explorer-archive-compatible.ps1 `
            -ArchivePath "apps/windows-tray/.build/packages/YTM-Tray-$version-win-arm64.zip" `
            -PayloadRoot "apps/windows-tray/.build/package-work/win-arm64/payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run windows-tray:update-manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build combined installer
        shell: pwsh
        run: |
          pnpm run windows-tray:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign combined installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\windows-tray\.build\installer
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed combined installer
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File `
            ./scripts/ci/verify-windows-tray-codesign.ps1 `
            -PayloadRoot "apps/windows-tray/.build/installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signed QA candidate
        uses: actions/upload-artifact@v7
        with:
          name: windows-tray-signed-candidate
          path: |
            apps/windows-tray/.build/installer/*.exe
            apps/windows-tray/.build/packages/*.zip
            apps/windows-tray/.build/update-manifest/*.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
