[tools]
node = "24"
pnpm = "11.9.0"
go = "1.24"
dotnet = "10.0"
actionlint = "1.7.12"
jj = "0.43.0"
vhs = "0.11.0"

[tasks.deps]
description = "Install JavaScript workspace dependencies."
run = "pnpm install"

[tasks.format]
description = "Format the repository."
run = "pnpm run format"

[tasks.check]
description = "Run the CI-equivalent local check."
run = "pnpm run check"

[tasks.dev-build]
description = "Build all dev extension targets."
run = "pnpm run dev:build"

[tasks.workflow-check]
description = "Lint GitHub Actions workflows."
run = "pnpm run workflow:check"

[tasks.cli-test]
description = "Run CLI connector tests."
run = "pnpm run cli:test"

[tasks.cli-demo-video]
description = "Render the CLI demo video."
run = "pnpm run cli:demo-video"

[tasks.windows-tray-build]
description = "Build the Windows tray app and native host."
run = "pnpm run windows-tray:build"

[tasks.windows-tray-test]
description = "Run Windows tray unit tests."
run = "pnpm run windows-tray:test"

[tasks.qa]
description = "Run a named remote QA suite. Pass -- <platform> <suite>."
run = "scripts/remote/qa.sh"

[tasks.qa-list]
description = "List remote QA suites and their verification contracts."
run = "scripts/remote/qa.sh --list"

[tasks.qa-macos-check]
description = "Run CI-equivalent checks on the remote macOS host."
run = "scripts/remote/qa.sh macos check"

[tasks.qa-linux-check]
description = "Run CI-equivalent checks on the remote Linux target."
run = "scripts/remote/qa.sh linux check"

[tasks.qa-windows-check]
description = "Run Windows-native checks on the remote Windows host."
run = "scripts/remote/qa.sh windows check"
