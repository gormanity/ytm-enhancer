<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1400" />
    <title>YTM Enhancer — Marquee Promo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #030303;
        color: #fff;
        font-family: "Roboto", "Arial", sans-serif;
      }

      .background {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 18% 52%,
            rgba(255, 0, 51, 0.11),
            transparent 35%
          ),
          radial-gradient(
            circle at 82% 45%,
            rgba(48, 139, 255, 0.11),
            transparent 38%
          ),
          linear-gradient(110deg, #08080a 0%, #020202 58%, #07070a 100%);
      }

      .brand {
        position: absolute;
        top: 50%;
        left: 78px;
        z-index: 5;
        width: 520px;
        transform: translateY(-50%);
      }

      .brand-icon {
        width: 92px;
        height: 92px;
        margin-bottom: 22px;
        filter: drop-shadow(0 12px 28px rgba(255, 0, 51, 0.18));
      }

      h1 {
        font-size: 45px;
        font-weight: 720;
        letter-spacing: -1px;
      }

      .tagline {
        max-width: 470px;
        margin-top: 12px;
        color: #a9a9af;
        font-size: 19px;
        line-height: 1.5;
      }

      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 29px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: #d0d0d4;
        font-size: 13px;
        padding: 8px 13px;
      }

      .feature svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: #ff3158;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .surfaces {
        position: absolute;
        top: 38px;
        right: 35px;
        width: 735px;
        height: 484px;
      }

      .surface {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #070708;
        box-shadow:
          0 28px 65px rgba(0, 0, 0, 0.65),
          inset 0 1px rgba(255, 255, 255, 0.04);
      }

      .surface img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .surface-label {
        position: absolute;
        top: 12px;
        left: 13px;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(10, 10, 12, 0.84);
        color: #d8d8dc;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        padding: 6px 9px;
        text-transform: uppercase;
      }

      .mac {
        top: 54px;
        left: 0;
        z-index: 1;
        width: 300px;
        height: 314px;
        opacity: 0.78;
        transform: rotate(-2deg);
      }

      .windows {
        top: 10px;
        left: 250px;
        z-index: 3;
        width: 270px;
        height: 338px;
        transform: rotate(1.2deg);
      }

      .terminal {
        right: 0;
        bottom: 8px;
        z-index: 4;
        width: 430px;
        height: 242px;
        transform: rotate(-0.8deg);
      }

      .terminal img {
        padding: 10px;
      }

      .connection {
        position: absolute;
        z-index: 0;
        border-radius: 50%;
        opacity: 0.45;
      }

      .connection.one {
        top: 122px;
        left: 166px;
        width: 245px;
        height: 245px;
        border: 1px solid rgba(255, 49, 88, 0.28);
      }

      .connection.two {
        right: 52px;
        bottom: 32px;
        width: 280px;
        height: 280px;
        border: 1px solid rgba(57, 124, 255, 0.25);
      }

      .accent {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          #ff0033 28%,
          #397cff 72%,
          transparent
        );
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>

    <section class="brand">
      <img
        class="brand-icon"
        src="../../src/assets/icon.svg"
        alt="YTM Enhancer"
      />
      <h1>YTM Enhancer</h1>
      <p class="tagline">Make YouTube Music work the way you listen.</p>
      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="m10 8 6 4-6 4V8z" />
          </svg>
          Automation
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M21 15V5a2 2 0 0 0-2-2H9" />
            <path d="M21 9H12a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9" />
          </svg>
          Mini Player
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect width="7" height="7" x="3" y="3" rx="1.5" />
            <rect width="7" height="7" x="14" y="3" rx="1.5" />
            <rect width="7" height="7" x="8.5" y="14" rx="1.5" />
            <path d="M10 6.5h4" />
            <path d="M7.5 10v2.5l2.5 2.5" />
            <path d="M16.5 10v2.5L14 15" />
          </svg>
          Connected Apps (Beta)
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="13" r="8" />
            <path d="M12 9v4l2 2" />
            <path d="M5 3 2 6" />
            <path d="m22 6-3-3" />
          </svg>
          Sleep Timer
        </div>
      </div>
    </section>

    <section class="surfaces" aria-label="Connected Apps (Beta)">
      <div class="connection one"></div>
      <div class="connection two"></div>

      <div class="surface mac">
        <span class="surface-label">macOS</span>
        <img
          src="../../apps/menu-bar/release/menu-bar-screenshot.png"
          alt="YTM Menu Bar"
        />
      </div>

      <div class="surface windows">
        <span class="surface-label">Windows</span>
        <img
          src="../../apps/windows-tray/release/windows-tray-screenshot.png"
          alt="YTM Tray"
        />
      </div>

      <div class="surface terminal">
        <span class="surface-label">Terminal</span>
        <img
          src="../../apps/cli/release/cli-demo-poster.png"
          alt="YTM Enhancer CLI"
        />
      </div>
    </section>

    <div class="accent"></div>
  </body>
</html>
