<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1400" />
    <title>YTM Enhancer — Marquee Promo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #030303;
        color: #fff;
        font-family: "Roboto", "Arial", sans-serif;
      }

      .background {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 14% 48%,
            rgba(255, 0, 51, 0.15),
            transparent 35%
          ),
          radial-gradient(
            circle at 82% 48%,
            rgba(48, 139, 255, 0.13),
            transparent 38%
          ),
          linear-gradient(110deg, #0b080a 0%, #020202 54%, #07070b 100%);
      }

      .brand {
        position: absolute;
        top: 50%;
        left: 72px;
        z-index: 5;
        width: 510px;
        transform: translateY(-50%);
      }

      .brand-icon {
        width: 90px;
        height: 90px;
        margin-bottom: 22px;
        filter: drop-shadow(0 12px 28px rgba(255, 0, 51, 0.2));
      }

      h1 {
        font-size: 46px;
        font-weight: 720;
        letter-spacing: -1px;
      }

      .tagline {
        max-width: 490px;
        margin-top: 12px;
        color: #c1c1c7;
        font-size: 21px;
        line-height: 1.45;
      }

      .features {
        display: flex;
        gap: 9px;
        margin-top: 28px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: #dedee2;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 11px;
      }

      .feature svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: #ff3158;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .surfaces {
        position: absolute;
        top: 28px;
        right: 34px;
        width: 770px;
        height: 504px;
      }

      .surface {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 17px;
        background: #070708;
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.65),
          inset 0 1px rgba(255, 255, 255, 0.04);
      }

      .surface img {
        position: absolute;
        display: block;
        max-width: none;
      }

      .surface-label {
        position: absolute;
        top: 12px;
        left: 13px;
        z-index: 4;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(8, 8, 10, 0.9);
        color: #e0e0e4;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.8px;
        padding: 6px 9px;
        text-transform: uppercase;
      }

      .playback {
        top: 22px;
        left: 0;
        z-index: 1;
        width: 560px;
        height: 390px;
        transform: rotate(-1.4deg);
      }

      .playback img {
        top: -62px;
        right: 70px;
        width: 820px;
        height: auto;
      }

      .mini {
        right: 0;
        bottom: 10px;
        z-index: 3;
        width: 480px;
        height: 286px;
        transform: rotate(1deg);
      }

      .mini img {
        right: -212px;
        bottom: -4px;
        width: 904px;
        height: auto;
      }

      .orbit {
        position: absolute;
        right: 8px;
        bottom: 18px;
        width: 330px;
        height: 330px;
        border: 1px solid rgba(57, 124, 255, 0.22);
        border-radius: 50%;
      }

      .accent {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          #ff0033 28%,
          #397cff 72%,
          transparent
        );
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="background"></div>

    <section class="brand">
      <img
        class="brand-icon"
        src="../../src/assets/icon.svg"
        alt="YTM Enhancer"
      />
      <h1>YTM Enhancer</h1>
      <p class="tagline">The YouTube Music controls you’ve been missing.</p>
      <div class="features">
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
            <circle cx="8" cy="6" r="2" />
            <circle cx="16" cy="12" r="2" />
            <circle cx="10" cy="18" r="2" />
          </svg>
          Playback Controls
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M21 15V5a2 2 0 0 0-2-2H9" />
            <path d="M21 9H12a2 2 0 0 0-2 2v8" />
          </svg>
          Mini Player
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="13" r="8" />
            <path d="M12 9v4l2 2M5 3 2 6m20 0-3-3" />
          </svg>
          Automation
        </div>
      </div>
    </section>

    <section class="surfaces" aria-label="YTM Enhancer extension features">
      <div class="orbit"></div>
      <div class="surface playback">
        <span class="surface-label">Playback Controls</span>
        <img
          src="./01-playback-controls.png"
          alt="YTM Enhancer playback controls"
        />
      </div>
      <div class="surface mini">
        <span class="surface-label">Mini Player</span>
        <img src="./02-mini-player.png" alt="YTM Enhancer Mini Player" />
      </div>
    </section>

    <div class="accent"></div>
  </body>
</html>
